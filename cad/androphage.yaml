
# Androphage Parameters
main_half: left
tent_angle: 10
center_width: 7
pcb_thickness: &pcb_thickness 1.6
pivot_depth: 80
colors:
  black: &black [0x202020, 1]
  brass: &brass [DarkGoldenrod, 1]
  clear: &clear [White, 0.3]
  pcb_color: &pcb_color [MediumPurple, 1]
  purple: &purple [MediumPurple, 1]
  silver: &silver [Silver, 1]
  smoke: &smoke [Black, 0.5]
  steel: &steel [DarkGray, 1]
Print:
  # Angle for overhangs on 3d-printed parts.
  overhang_angle: 45
  # Default thickness for 3d-printed parts.
  wall_thickness: &wall_thickness 2
  min_wall_thickness: 1
Columns:
  # Thumb columns
  reach:
    # connect: 1
    cutout: true
    splay: -45
    spread: 0.5
    stagger: 0.5
  home:
    connect: 1
    cutout: true
    keys: 2
    splay: 10
  tuck:
    connect: 1
    cutout: true
    splay: 10
  # Finger columns
  inner:
    connect: 1
    cutout: true
    keys: 3
    shift: [1, 1]
    splay: 10
    spread: 1
  index:
    cutout: true
    keys: 4
    spread: 0
  middle:
    keys: 4
    stagger: 0.25
  ring:
    keys: 4
    shift: [0, -0.25]
    splay: 5
    spread: 1.111 # 20 mm
  pinky:
    keys: 3
    splay: 10
    spread: 1.111 # 20 mm
  outer:
    skip: true
    keys: 2
    stagger: 0.75
Battery:
  visible: true
  size: [ 34, 4.0, 50 ] #Dimensions of battery.
  color: *silver

# ---- BTU Options ----
BTU_Options:
  Rexroth: &Rexroth
    visible: true
    adjust_screw: true
    ball_diameter: 7.938
    ball_height: 1.6
    clearance: 10
    collar_height: 1.3
    color: *steel
    flange_diameter: 17
    flange_height: 1.9
    housing_diameter: 12.6
    housing_height: 6.4
    model: Rexroth
  VCN310: &VCN310
    visible: true
    adjust_screw: true
    ball_diameter: 4
    ball_height: 1.1
    clearance: 10
    color: *steel
    flange_diameter: 9
    flange_height: 1
    housing_diameter: 7.5
    housing_height: 4
    model: VCN310
  VCN319: &VCN319
    visible: true
    adjust_screw: false
    ball_diameter: 4.76
    ball_height: 1.2
    clearance: 10
    color: *steel
    drive_width: 5
    drive_depth: 6
    flange_diameter: 7
    flange_height: 0
    housing_diameter: 7
    housing_height: 14.8
    model: VCN319

# ---- Screw Options ----
Screw_Options:
  M2: &M2
    visible: true
    color: *steel
    counter_sink_diameter: 4.4
    diameter: 2
    drive_depth: 1
    drive_width: 1.3
    head_diameter: 4
    head_angle: 90
    hole_diameter: 2.4
    minor_diameter: 1.6
  M3: &M3
    visible: true
    color: *steel
    counter_sink_diameter: 6.6
    diameter: 3
    drive_depth: 1.1
    drive_width: 2
    head_diameter: 6
    head_angle: 90
    hole_diameter: 3.6
    minor_diameter: 2.5
  M4: &M4
    visible: true
    color: *steel
    counter_sink_diameter: 8.8
    diameter: 4
    drive_depth: 1.5
    drive_width: 2.5
    head_diameter: 8
    head_angle: 90
    hole_diameter: 4.8
    minor_diameter: 3.3
# ---------------------
Base:
  visible: true
  color: *black
  foot_width: 5
  opening_clearance: 1
BTU: *VCN310
CenterBlock:
  visible: true
  # 47 degrees for the BTU Z angle adds a bit of clearance for the sensor
  # without significantly affecting the stability of the trackball.
  btu_angles: [ 0, 60, 47 ]
  color: *black
  rib_size: [ 2, 2 ]
  screw_count: 3
  wall_thickness: *wall_thickness
Desk:
  visible: true
  color: *clear
  size: [ 300, 200, 1 ]
  position: [ 0, 0, -40 ]
Frame:
  visible: true
  color: *black
  chord_angle: 4 # Angle between the chord of the main arc and vertical.
  fillet_radius: 1
  lip_depth: 1
  main_radius: 50
  notch_depth: 6
  screw_count: 5
  thickness: 5
Hinge:
  # https://www.mcmaster.com/11555A61/ or https://www.mcmaster.com/1624A62/
  visible: true
  color: *steel
  diameter: 6
  pin_diameter: 3 #2.3876
  plate_thickness: 1.5875
  position: [ 0, 0, 0 ]
  screw: *M2
  screw_position: 3.5
  taper_pin_diameter: 1.55194
  taper_pin_position: 6
  thickness: 3
Insert:
  visible: true
  color: *brass
  diameter: 3
  height: 3
  hole_diameter: 2.8
  hole_depth: 4
  wall_thickness: 1.6
Keycap_Profile_Options:
  Cherry: &Cherry
    height: 10
  Chicago_Steno: &Chicago_Steno # Recommended
    height: 8.5
  DES: &DES # Not recommended
    height: 17
  DSA: &DSA
    height: 8
  FMX: &FMX
    height: 6.3
  funkmonk: &funkmonk
    height: 6
  JWA: &JWA
    height: 6.7
  KEA: &KEA
    height: 5.7
  Lame: &Lame
    height: 10
  SCS: &SCS
    height: 5.5
  sqdg: &sqdg
    height: 7
  XDA: &XDA
    height: 9.5
Keycap_Spacing_Options:
  Choc: &Choc [18, 17]
  MX: &MX_Metric [19, 19]
  MX_Inch: &MX_Inch [19.05, 19.05]
Keycap:
  visible: true
  color: *black
  profile: *Chicago_Steno
  spacing: *Choc
LED:
  visible: true
  color:
  present: true
  count: 4
  hole_radius: 0.2
  hole_shape: square #[ square, circle ]
  hole_size: 3
  hole_spacing: [ 4.5, 0 ]
  position_y: -13
Magnet:
  visible: true
  color: *silver
  shape: bar
  size: [8, 50, 3]
MagneticConnector:
  visible: true
  color: *black
  lip: [ 1.0, 28.5, 8.0 ]
  lip_offset: 1.0
  pcb_size: [*pcb_thickness, 44, 10]
  position: [0, 28, -10]
  size: [ 4.7, 26.5, 6.0 ]
  screw_offset: 18
MCU:
  visible: true
  color:
  chip_size: [ 12, 10, 1.5 ]
  location: main PCB #[ trackball sensor, magnetic connector, main PCB ]
  radius: 2
  size: [ 17.8, 21, 1.2 ]
OLED:
  visible: true
  color:
  present: false
  hole_radius: 0.5
  pcb_size: [ 15.5, 13 ]
  position: [ 0, 0 ]
  screen_size: [ 12.58, 6.98 ]
Plates:
  Bottom:
    visible: true
    add_center: true
    clearance: 0.2
    radius_outer: 2
    screw: *M2
    # FR4 (PCB) bottom plate
    color: *pcb_color
    thickness: *pcb_thickness
    # Smoke-colored acrylic bottom plate
    # color: *smoke
    # thickness: 3
    # Stainless steel bottom plate
    # color: *steel
    # thickness: 0.76
  PCB:
    visible: true
    add_center: false
    color: *pcb_color
    # This ensures clearance between the PCB and bottom plate
    clearance: 3
    radius_outer: 2
    thickness: *pcb_thickness
  Switch:
    visible: true
    add_center: false
    clearance: 0.5 # Must be less than Frame.lip_depth
    color: *pcb_color
    edge: 4.5
    radius_outer: 2
    # thickness: *pcb_thickness
  Top:
    visible: true
    add_center: true
    color: *black
    radius_inner: 2
    radius_outer: 2
    thickness: *wall_thickness
    thumb_cutout_fillet: false

